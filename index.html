<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1b1b">
<link rel="manifest" href="manifest.json">
<title>automata-meow</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- the whole canvas is one svg, everything inside gets re-rendered on change -->
<svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg>
<div id="empty-hint" class="hidden">Tap + state to start</div>

<!-- symbol input for the transition tool, hidden until a from/to pair is picked -->
<div id="symbol-pop" class="hidden">
  <span id="symbol-pair"></span>
  <div id="symbol-fa">
    <input id="symbol-input" autocomplete="off" placeholder="symbol (empty = ε)">
  </div>
  <div id="symbol-pda" class="hidden">
    <input id="pda-read" autocomplete="off" placeholder="read (empty=ε)">
    <input id="pda-pop" autocomplete="off" placeholder="pop (empty=ε)">
    <input id="pda-push" autocomplete="off" placeholder="push (empty=ε)">
  </div>
  <button id="symbol-ok">add</button>
  <button id="symbol-cancel">cancel</button>
</div>

<!-- state actions, visible while a state is selected in move mode -->
<div id="state-actions" class="hidden">
  <span class="label">selected</span>
  <button id="btn-initial">start</button>
  <button id="btn-final">final</button>
  <button id="btn-rename">rename</button>
</div>

<!-- bottom toolbar, thumb reach on a phone -->
<div id="toolbar">
  <button data-tool="add" class="active">+ state</button>
  <button data-tool="move">move</button>
  <button data-tool="link">+ trans</button>
  <button data-tool="delete">del</button>
  <button id="btn-sim">sim</button>
</div>

<div id="topbar">
  <label class="btn">import<input id="file-import" type="file" accept=".jff,.jflap,.xml" hidden></label>
  <input id="export-name" value="automaton" autocomplete="off" spellcheck="false" title="export filename without extension">
  <select id="export-ext" title="export extension">
    <option value=".jflap">.jflap</option>
    <option value=".jff">.jff</option>
    <option value=".png">.png</option>
    <option value=".jpg">.jpg</option>
  </select>
  <select id="automaton-type" title="automaton type">
    <option value="fa">FA</option>
    <option value="pda">PDA</option>
  </select>
  <input id="initial-stack" value="Z" maxlength="3" title="initial stack symbol" placeholder="Z" style="width: 40px; display: none;">
  <button id="btn-export" class="btn">export</button>
  <span id="dirty" class="hidden">● unsaved</span>
  <button id="btn-undo" class="icon-btn" title="undo" disabled>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h10a5 5 0 0 1 0 10h-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M7 5 3 9l4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button id="btn-redo" class="icon-btn" title="redo" disabled>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 9H11a5 5 0 0 0 0 10h3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="m17 5 4 4-4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
</div>

<div id="sim-bar" class="hidden">
  <input id="sim-input" placeholder="test string" autocomplete="off" spellcheck="false">
  <button id="sim-prev">◀</button>
  <span id="sim-pos">0 / 0</span>
  <button id="sim-next">▶</button>
  <span id="sim-status"></span>
  <span id="sim-stack"></span>
</div>

<!-- rename input for the selected state -->
<div id="rename-pop" class="hidden">
  <input id="rename-input" autocomplete="off">
  <button id="rename-ok">ok</button>
  <button id="rename-cancel">cancel</button>
</div>

<!-- dev event log, only populated with ?debug in the url -->
<div id="debug" class="hidden"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
